name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Ephemeral CI credentials only — never real production secrets.
# Backend integration tests need PostgreSQL plus the existing Prisma migrations and seed data.

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_erp_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mini_erp_crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: '4000'
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_erp_crm?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-for-production-use
      JWT_EXPIRES_IN: 1d
      EMAIL_FROM: ''
      SMTP_HOST: ''
      SMTP_PORT: '587'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      SMTP_SECURE: 'false'
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Seed development test data
        # Existing suite asserts seeded users/customers/products/challans (see tests/database.test.ts).
        run: npx prisma db seed

      - name: Run backend tests
        run: npm test

      - name: Typecheck backend
        run: npm run typecheck

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:4000/api
