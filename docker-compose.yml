# Placeholder for a later database phase.
# Phase 1 does not start or connect to PostgreSQL.
# This file is intentionally minimal and is not a production deployment.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-erp-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mini_erp_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_erp_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
